
name: CI

on:
  push:
    branches: [feature/github-app-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  scraper:
    name: Scraper Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: scraper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.14"

      - name: Install scraper dependencies
        run: uv sync --locked

      - name: Run Ruff lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Run scraper tests
        run: uv run --locked pytest -q

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scadable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Run integration tests only against the isolated GitHub Actions database.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/scadable_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/scadable_test
      # No paid API requests, competing refreshes or GitHub background syncs in CI.
      RUN_LIVE_PIPELINE_TEST: "0"
      AUTO_REFRESH_ENABLED: "false"
      GITHUB_SYNC_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install scraper and LLM dependencies
        # Install the scraper as a regular package to avoid source-path import shadowing.
        # ./llm must be listed: pip cannot resolve the local scadable-llm dependency on its own.
        run: python -m pip install ./scraper -e ./llm -e ".[dev]"

      - name: Run all backend tests (including GitHub App + feature sync)
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
