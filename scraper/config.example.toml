# Example domains are configuration examples, not live test targets.
[global]
strategy = "best_first"
max_pages = 50
max_depth = 3
max_discovered_urls = 5000
max_sitemap_documents = 20
max_sitemap_requests = 50
max_sitemap_depth = 3
max_sitemap_bytes = 2097152
max_redirects = 5
max_concurrency = 4
max_concurrent_competitors = 2
per_domain_concurrency = 1
request_delay_seconds = [1.0, 2.0]
page_timeout_seconds = 45.0
capacity_wait_timeout_seconds = 120.0
discovery_timeout_seconds = 30.0
max_retries = 2
max_backoff_seconds = 30.0
respect_robots_txt = true
# Markdown-only cleanup: original links and rendered HTML remain available to discovery.
markdown_remove_navigation_and_footer = true
markdown_remove_boilerplate = true
# Keep fetched artifacts; reuse exact-body assessments and skip known final targets.
deduplicate_pages = true
markdown_excluded_selectors = []

[global.dynamic]
scan_full_page = false
max_scroll_steps = 5
wait_timeout_seconds = 10.0

# LLM selection requires OPENAI_API_KEY; use "structural" for API-free crawling.
[global.selection]
mode = "llm"
# Optional research goal; omitting it uses the company-specific default.
# objective = "Research capabilities, pricing, integrations, customer evidence and hiring."
budget_usd = 0.03
exploration_fraction = 0.20
# Opt-in bounded evidence/answers in decisions.jsonl; not included in the normal summary.
trace_enabled = false
# Approximate category hints; no additional Decisions questions or coverage quotas.
coverage_enabled = true
timeout_seconds = 15.0
max_retries = 2
max_concurrency = 2

[[competitors]]
homepage_url = "https://example.com/"
name = "Example"

[competitors.overrides]
max_pages = 20
# Exact extra hosts must be approved before adding them here.
allowed_domains = []
# Optional site-specific menu/footer CSS; lists replace the global list.
# markdown_excluded_selectors = [".site-menu", ".site-footer"]

[[competitors.overrides.dynamic_rules]]
url_pattern = "https://example.com/careers*"
wait_for_css = "main"
scan_full_page = true
max_scroll_steps = 5
# First matching rule wins; clicks are bounded and pause for scroll_delay_seconds.
load_more_selector = "button.load-more"
max_clicks = 3

[[competitors]]
homepage_url = "https://example.org/"
